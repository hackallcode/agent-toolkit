# skills/** is built from modes/** and published to `dist`, the branch the plugin installs from (CONTRIBUTING.md, «Ветка `dist`»).

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the dist branch'
        type: boolean
        default: false
      dist_branch:
        description: 'Branch to publish to'
        type: string
        default: dist

permissions:
  contents: read

jobs:
  # A broken build fails silently as an empty plugin, so it is checked on every PR, not only before publishing.
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: ./scripts/build-skills.py
      - run: test -f skills/build/SKILL.md
      - run: test -f skills/build/common.md
      - run: python -m py_compile scripts/*.py scripts/mr_watch/*.py
      - run: bash -n scripts/mr-reply.sh

  # The tests fake `glab`; `jq` and `gawk` come with the runner image.
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest pyyaml
      - run: python -m pytest tests -q

  publish-skills:
    needs: [check-skills, test-scripts]
    # A manual run with `publish` checks publishing before merge; `dist_branch` keeps it off the live `dist`.
    if: github.event_name == 'push' || inputs.publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      DIST_BRANCH: ${{ inputs.dist_branch || 'dist' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version patch is the commit count, which a shallow clone truncates.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: ./scripts/build-skills.py --stamp-version
      - run: |
          git config user.name "${SKILLS_PUBLISH_NAME:-github-actions[bot]}"
          git config user.email "${SKILLS_PUBLISH_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          # A force-push to the source branch would replace it with a build.
          [ "$DIST_BRANCH" != "$DEFAULT_BRANCH" ] || { echo "::error::dist_branch must not be $DEFAULT_BRANCH"; exit 1; }
          git checkout -B "$DIST_BRANCH"
          # skills/ is gitignored in the source branch.
          git add -f skills .claude-plugin/plugin.json .codex-plugin/plugin.json
          git commit --no-gpg-sign -m "Build skills from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DIST_BRANCH"
        env:
          SKILLS_PUBLISH_NAME: ${{ vars.SKILLS_PUBLISH_NAME }}
          SKILLS_PUBLISH_EMAIL: ${{ vars.SKILLS_PUBLISH_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
